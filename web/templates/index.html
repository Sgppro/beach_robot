<!DOCTYPE html>
<html>
<head>
    <title>Beach Robot Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 30px;
            background-color: #eef2f3;
        }

        /* --- 1. Smaller Map --- */
        .map-container {
            position: relative;
            display: inline-block;
            max-width: 60%; /* significantly reduced overall width */
            margin: 0 auto; /* Center it horizontally */
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-radius: 12px;
            overflow: hidden; /* Cleans up the corners of the rotated image */
        }
        .map-image {
            display: block;
            max-width: 100%; /* Fill the container width */
            max-height: 40vh; /* significantly reduced max height */
            width: auto;
            height: auto;
            /* No rotation applied here, just scaling. Rotate in file if needed. */
        }

        /* Dot scales with percentage (%) automatically */
        .dot {
            position: absolute;
            width: 16px;
            height: 16px;
            background-color: red;
            border-radius: 50%;
            border: 2px solid white;
            transform: translate(-50%, -50%);
            transition: top 0.3s, left 0.3s; /* Smooth gliding */
            
            /* Initial starting position */
            left: 50%;
            top: 50%;
        }

        /* --- 2. Bigger Text Box --- */
        .ai-display {
            margin: 30px auto; /* Centered horizontally, more vertical space */
	    margin-bottom: 0px;
	    margin-top: 20px;
            padding: 20px 40px; /* Increased internal padding for a bigger feel */
            background-color: #2c3e50;
            color: white;
            display: block; /* Full width flow */
            border-radius: 12px; /* Slightly smoother corners */
            font-size: 1.8em; /* Much larger font size for readability */
            width: 95%; /* Fill almost all width */
            max-width: 1100px; /* Increased maximum width */
            box-shadow: 0 6px 10px rgba(0,0,0,0.2); /* Deeper shadow */
            text-align: left; /* Left-aligned text in larger blocks */
        }
        .ai-display strong {
            font-weight: bold;
            font-size: 1.1em; /* Emphasize the "Robot says:" part even more */
            color: #ecf0f1; /* Slightly lighter color for the strong text accent */
            display: block; /* Make "Robot says:" be on its own line */
            margin-bottom: 10px; /* Space between label and message */
        }
    </style>
</head>
<body>

    <h2>Live Robot Dashboard</h2>

    <div class="map-container">
        <img src="{{ url_for('static', filename='map.png') }}" alt="Robot Map" class="map-image">
        <div class="dot" id="robot-dot"></div>
    </div>

    <br>

    <div class="ai-display">
        <strong>Robot says:</strong> <span id="ai-text">Loading...</span>
    </div>

    <script>
        function updateRobotState() {
            fetch('/get_robot_state')
                .then(response => response.json())
                .then(data => {
                    // 1. Update the AI Speech Text
                    document.getElementById('ai-text').innerText = data.message;
                    
                    // 2. Update the Red Dot using Percentages (%)
                    // The dot scales perfectly with the smaller map automatically
                    document.getElementById('robot-dot').style.left = data.x + '%';
                    document.getElementById('robot-dot').style.top = data.y + '%';
                })
                .catch(error => console.error('Error fetching robot state:', error));
        }

        // Run immediately, then check for updates every 1.5 seconds
        updateRobotState();
        setInterval(updateRobotState, 1500);
    </script>

</body>
</html>
